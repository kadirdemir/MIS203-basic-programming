<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1200" height="110" fill="#173b6c"/>
  <text x="60" y="48" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Week 2 – Lab Quiz</text>
  <text x="60" y="84" font-family="Arial, sans-serif" font-size="24" fill="#dbe8ff">Two-Item Purchase Quote</text>

  <rect x="50" y="140" rx="18" ry="18" width="350" height="250" fill="#eaf2ff" stroke="#aac7ef" stroke-width="2"/>
  <text x="75" y="180" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#173b6c">1. Inputs</text>
  <text x="75" y="220" font-family="Arial, sans-serif" font-size="19" fill="#24364b">• 2 item names</text>
  <text x="75" y="255" font-family="Arial, sans-serif" font-size="19" fill="#24364b">• quantities → int()</text>
  <text x="75" y="290" font-family="Arial, sans-serif" font-size="19" fill="#24364b">• unit prices → float()</text>
  <text x="75" y="325" font-family="Arial, sans-serif" font-size="19" fill="#24364b">• delivery fee</text>
  <text x="75" y="360" font-family="Arial, sans-serif" font-size="19" fill="#24364b">• tax percentage</text>

  <rect x="425" y="140" rx="18" ry="18" width="350" height="250" fill="#eaf9ef" stroke="#a7d8b6" stroke-width="2"/>
  <text x="450" y="180" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#176b3a">2. Calculation</text>
  <text x="450" y="220" font-family="Arial, sans-serif" font-size="19" fill="#24364b">line1 = qty1 × price1</text>
  <text x="450" y="255" font-family="Arial, sans-serif" font-size="19" fill="#24364b">line2 = qty2 × price2</text>
  <text x="450" y="290" font-family="Arial, sans-serif" font-size="19" fill="#24364b">subtotal = line1 + line2</text>
  <text x="450" y="325" font-family="Arial, sans-serif" font-size="19" fill="#24364b">tax = subtotal × tax%</text>
  <text x="450" y="360" font-family="Arial, sans-serif" font-size="19" fill="#24364b">total = subtotal + tax + delivery</text>

  <rect x="800" y="140" rx="18" ry="18" width="350" height="250" fill="#fff6df" stroke="#ecd08b" stroke-width="2"/>
  <text x="825" y="180" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#9a5b00">3. Required Test</text>
  <text x="825" y="225" font-family="Arial, sans-serif" font-size="20" fill="#24364b">2 × 50 = 100 TRY</text>
  <text x="825" y="260" font-family="Arial, sans-serif" font-size="20" fill="#24364b">1 × 80 = 80 TRY</text>
  <text x="825" y="295" font-family="Arial, sans-serif" font-size="20" fill="#24364b">Subtotal = 180 TRY</text>
  <text x="825" y="330" font-family="Arial, sans-serif" font-size="20" fill="#24364b">Tax 10% = 18 TRY</text>
  <text x="825" y="365" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#9a5b00">Final = 218.00 TRY</text>

  <rect x="50" y="420" rx="18" ry="18" width="535" height="270" fill="#241f35"/>
  <text x="75" y="465" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#ffffff">Key Python idea</text>
  <text x="75" y="510" font-family="Courier New, monospace" font-size="19" fill="#9fe59f">quantity = int(input(...))</text>
  <text x="75" y="545" font-family="Courier New, monospace" font-size="19" fill="#9fe59f">price = float(input(...))</text>
  <text x="75" y="580" font-family="Courier New, monospace" font-size="19" fill="#ffd479">print(f"{'Total: {final_total:.2f} TRY'}")</text>
  <text x="75" y="625" font-family="Arial, sans-serif" font-size="18" fill="#d9d6e3">input() returns text; convert before arithmetic.</text>
  <text x="75" y="655" font-family="Arial, sans-serif" font-size="18" fill="#d9d6e3">Money is printed with exactly two decimal places.</text>

  <rect x="615" y="420" rx="18" ry="18" width="535" height="270" fill="#fff0f0" stroke="#e6aaaa" stroke-width="2"/>
  <text x="640" y="465" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#9d2525">Error Case</text>
  <text x="640" y="515" font-family="Courier New, monospace" font-size="21" fill="#24364b">Quantity: two</text>
  <text x="640" y="555" font-family="Courier New, monospace" font-size="19" fill="#9d2525">ValueError: invalid literal for int()</text>
  <text x="640" y="610" font-family="Arial, sans-serif" font-size="19" fill="#24364b">Future improvement:</text>
  <text x="640" y="645" font-family="Arial, sans-serif" font-size="19" fill="#24364b">validate input with try/except and ask again.</text>

  <text x="600" y="735" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66778a">MIS203 Basic Programming • Week 02 Lab Quiz</text>
</svg>